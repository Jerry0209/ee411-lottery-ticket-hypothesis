name: torch_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - matplotlib
  - tqdm
  - ipykernel
  - jupyterlab
  - pytorch        # CPU build on macOS (Apple GPU uses MPS, not CUDA)
  - torchvision
  - pip:
      - pandas
      - scikit-learn
      - scipy
      - seaborn
